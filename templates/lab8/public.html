{% extends "base.html" %}

{% block lab %}Лабораторная работа 8{% endblock %}

{% block main %}
    <link rel="stylesheet" href="{{ url_for('static', filename='lab8.css') }}">
    <div class="lab8-page">
        <h1>Публичные статьи</h1>
        <form class="lab8-search" method="get" action="/lab8/search">
            <input type="text" name="q" placeholder="Поиск по статьям">
            <button type="submit" class="menu-item">Искать</button>
        </form>
        {% if articles %}
            <div class="article-list">
                {% for article in articles %}
                    <div class="article-card">
                        <h3>{{ article.title }}</h3>
                        <p>{{ article.article_text }}</p>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p>Публичных статей пока нет.</p>
        {% endif %}
    </div>
{% endblock %}
