{% extends "base.html" %}

{% block lab %}Лабораторная работа 8{% endblock %}

{% block main %}
    <link rel="stylesheet" href="{{ url_for('static', filename='lab8.css') }}">
    <div class="lab8-page">
        <h1>Редактировать статью</h1>
        <form class="lab8-form" method="post">
            <label class="form-field">
                Заголовок
                <input type="text" name="title" value="{{ article.title }}" required>
            </label>
            <label class="form-field">
                Текст статьи
                <textarea name="article_text" rows="6" required>{{ article.article_text }}</textarea>
            </label>
            <label class="form-check">
                <input type="checkbox" name="is_public" value="1" {% if article.is_public %}checked{% endif %}>
                Сделать статью публичной
            </label>
            {% if error %}
                <div class="form-error">{{ error }}</div>
            {% endif %}
            <button type="submit" class="menu-item">Сохранить</button>
        </form>
    </div>
{% endblock %}
